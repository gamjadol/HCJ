<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글로벌 문서 요점 요약기</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Mammoth.js (DOCX) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <!-- PDF.js (PDF) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body class="bg-slate-50 min-h-screen py-10 px-4 text-slate-800">
    <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-md p-6 sm:p-8 border border-slate-100">
        <!-- 헤더 -->
        <header class="text-center mb-8">
            <h1 class="text-2xl font-bold text-slate-900 mb-2">🌐 글로벌 문서 요점 요약기</h1>
            <p class="text-sm text-slate-600">
                한국어, 日本語(일본어), English 등 모든 언어 문서를 지원합니다.
            </p>
        </header>

        <!-- 파일 업로드 -->
        <div class="mb-6">
            <label class="block text-sm font-medium text-slate-700 mb-2">문서 파일 업로드 (.pdf, .docx, .txt)</label>
            <input type="file" id="fileInput" accept=".pdf, .docx, .txt" 
                   class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer border border-slate-200 rounded-lg p-1"/>
        </div>

        <!-- 슬라이더 -->
        <div class="mb-6">
            <div class="flex justify-between items-center mb-2">
                <label for="sentenceSlider" class="text-sm font-medium text-slate-700">요약 분량 선택:</label>
                <span id="sliderValue" class="text-indigo-600 font-bold text-base">3문장</span>
            </div>
            <input type="range" id="sentenceSlider" min="1" max="5" value="3" 
                   class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-indigo-600">
            <div class="flex justify-between text-xs text-slate-400 mt-1">
                <span>1문장</span>
                <span>2문장</span>
                <span>3문장</span>
                <span>4문장</span>
                <span>5문장</span>
            </div>
        </div>

        <!-- 요약 버튼 -->
        <button id="summarizeBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 shadow disabled:bg-slate-300">
            🚀 핵심 요점 요약하기
        </button>

        <!-- 상태 메세지 -->
        <div id="statusMessage" class="hidden mt-4 text-center text-sm font-medium text-indigo-600">
            ⏳ 다국어 문장 분할 및 어휘 분석 중...
        </div>

        <!-- 감지된 문장 상태 알림 -->
        <div id="infoAlert" class="hidden mt-4 p-3 bg-blue-50 border border-blue-200 text-blue-800 text-xs sm:text-sm rounded-lg">
        </div>

        <!-- 결과 영역 -->
        <div id="resultContainer" class="hidden mt-8 border-t pt-6 space-y-6">
            <!-- 핵심 키워드 -->
            <div>
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">🔑 주요 키워드</h3>
                <div id="keywordsList" class="flex flex-wrap gap-2"></div>
            </div>

            <!-- 요약 문장 -->
            <div>
                <h2 class="text-lg font-bold text-slate-900 mb-3 flex items-center justify-between">
                    <span>📌 요점 요약 결과</span>
                    <span id="resultBadge" class="text-xs font-semibold bg-indigo-100 text-indigo-700 px-2.5 py-1 rounded-full"></span>
                </h2>
                <div id="summaryResult" class="space-y-3"></div>
            </div>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const fileInput = document.getElementById('fileInput');
        const sentenceSlider = document.getElementById('sentenceSlider');
        const sliderValue = document.getElementById('sliderValue');
        const summarizeBtn = document.getElementById('summarizeBtn');
        const statusMessage = document.getElementById('statusMessage');
        const infoAlert = document.getElementById('infoAlert');
        const resultContainer = document.getElementById('resultContainer');
        const keywordsList = document.getElementById('keywordsList');
        const summaryResult = document.getElementById('summaryResult');
        const resultBadge = document.getElementById('resultBadge');

        // 불용어 (제외 단어)
        const STOPWORDS = new Set([
            'the','and','a','to','of','in','is','that','for','it','as','was','with','on','at','by','this','an','be','are','from','or','have','not','which','but','they','has','will',
            '경우', '위해', '통해', '관한', '대한', '관련', '때문', '따라서', '그리고', '하지만', '또한', '이러한', '모든', '통해', '하여', '되고', '있는', '없는', '입니다', '합니다',
            'です', 'ます', 'こと', 'もの', 'ため', 'よう', 'これ', 'それ', 'あれ'
        ]);

        sentenceSlider.addEventListener('input', (e) => {
            sliderValue.textContent = `${e.target.value}문장`;
        });

        summarizeBtn.addEventListener('click', async () => {
            const file = fileInput.files[0];
            if (!file) {
                alert('파일을 선택해 주세요.');
                return;
            }

            const targetCount = parseInt(sentenceSlider.value);
            showStatus(true);
            resultContainer.classList.add('hidden');
            infoAlert.classList.add('hidden');

            try {
                const text = await extractTextFromFile(file);
                if (!text.trim()) {
                    alert('문서에서 텍스트를 읽을 수 없습니다.');
                    showStatus(false);
                    return;
                }

                // 1. 문장 분할
                const sentences = splitMultilingualSentences(text);

                if (sentences.length === 0) {
                    alert('분석 가능한 문장이 없습니다.');
                    showStatus(false);
                    return;
                }

                // 문장 수 안내
                infoAlert.innerHTML = `📄 문서에서 총 <b>${sentences.length}개 문장</b>이 감지되었습니다.`;
                if (sentences.length < targetCount) {
                    infoAlert.innerHTML += `<br>⚠️ 문서 전체 문장 수가 부족하여 ${sentences.length}문장 전체가 요약됩니다.`;
                }
                infoAlert.classList.remove('hidden');

                // 2. 개선된 일본어/다국어 정밀 어휘 분석
                const { topKeywords, sentenceScores } = analyzeMultilingualText(sentences);

                // 3. 요약 문장 선별
                const summary = getTopSentences(sentences, sentenceScores, targetCount);

                // 4. 화면 출력
                renderResults(topKeywords, summary);
            } catch (error) {
                console.error(error);
                alert('분석 중 오류 발생: ' + error.message);
            } finally {
                showStatus(false);
            }
        });

        // 파일 읽기
        async function extractTextFromFile(file) {
            const fileName = file.name.toLowerCase();
            if (fileName.endsWith('.txt')) {
                return await file.text();
            } else if (fileName.endsWith('.docx')) {
                const arrayBuffer = await file.arrayBuffer();
                const result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
                return result.value;
            } else if (fileName.endsWith('.pdf')) {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                let fullText = '';
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const content = await page.getTextContent();
                    fullText += content.items.map(item => item.str).join(' ') + '\n';
                }
                return fullText;
            }
            throw new Error('지원하지 않는 파일 형식입니다.');
        }

        // 다국어 문장 분할 (일본어 。！？ 포함)
        function splitMultilingualSentences(text) {
            let cleanText = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
            cleanText = cleanText.replace(/([.!?。！？])([^\n])/g, "$1\n$2");

            return cleanText
                .split(/\n+/)
                .map(s => s.trim())
                .filter(s => s.length >= 3);
        }

        // [핵심 수정] 일본어 한자/가타카나 정밀 토큰화 엔진
        function tokenizeSentence(sentence) {
            // 1. 일본어 한자 단어(2자 이상): [\u4e00-\u9faf]{2,}
            // 2. 일본어 가타카나 외래어(2자 이상): [\u30a0-\u30ff]{2,}
            // 3. 한글 단어(2자 이상): [가-힣]{2,}
            // 4. 영문 단어(2자 이상): [a-zA-Z]{2,}
            const pattern = /[\u4e00-\u9faf]{2,}|[\u30a0-\u30ff]{2,}|[가-힣]{2,}|[a-zA-Z]{2,}/g;
            const matches = sentence.match(pattern) || [];

            return matches
                .map(w => w.toLowerCase())
                .filter(w => !STOPWORDS.has(w));
        }

        // 다국어 분석
        function analyzeMultilingualText(sentences) {
            const wordFreq = {};
            const sentenceTokens = [];

            sentences.forEach(sent => {
                const tokens = tokenizeSentence(sent);
                tokens.forEach(t => {
                    wordFreq[t] = (wordFreq[t] || 0) + 1;
                });
                sentenceTokens.push(tokens);
            });

            // 상위 5개 키워드
            const sortedWords = Object.keys(wordFreq).sort((a, b) => wordFreq[b] - wordFreq[a]);
            const topKeywords = sortedWords.slice(0, 5);

            // 문장 점수 계산
            const sentenceScores = sentences.map((sent, idx) => {
                const tokens = sentenceTokens[idx];
                if (tokens.length === 0) return 0;

                let score = 0;
                tokens.forEach(t => {
                    if (wordFreq[t]) score += wordFreq[t];
                });

                score = score / Math.sqrt(tokens.length);
                const positionWeight = 1 + (sentences.length - idx) / sentences.length * 0.2;
                return score * positionWeight;
            });

            return { topKeywords, sentenceScores };
        }

        // 요약 문장선별
        function getTopSentences(sentences, scores, count) {
            const actualCount = Math.min(count, sentences.length);

            const indexed = scores.map((score, index) => ({ index, score }));
            indexed.sort((a, b) => b.score - a.score);

            const topIndices = indexed.slice(0, actualCount).map(item => item.index);
            topIndices.sort((a, b) => a - b);

            return topIndices.map(i => sentences[i]);
        }

        // 결과 출력
        function renderResults(keywords, summaryList) {
            keywordsList.innerHTML = '';
            keywords.forEach(kw => {
                const span = document.createElement('span');
                span.className = 'bg-indigo-100 text-indigo-800 text-xs font-semibold px-2.5 py-1 rounded-full';
                span.textContent = `# ${kw}`;
                keywordsList.appendChild(span);
            });

            summaryResult.innerHTML = '';
            summaryList.forEach((sentence, index) => {
                let highlightedSent = sentence;
                keywords.forEach(kw => {
                    if (kw.length >= 2) {
                        const regex = new RegExp(`(${kw})`, 'gi');
                        highlightedSent = highlightedSent.replace(regex, `<mark class="bg-yellow-200 px-1 rounded font-semibold">$1</mark>`);
                    }
                });

                const div = document.createElement('div');
                div.className = 'flex items-start gap-3 bg-white p-4 rounded-lg border border-slate-200 shadow-sm';
                div.innerHTML = `
                    <span class="flex-shrink-0 w-6 h-6 rounded-full bg-indigo-600 text-white text-xs font-bold flex items-center justify-center mt-0.5">
                        ${index + 1}
                    </span>
                    <p class="text-slate-800 text-sm leading-relaxed">${highlightedSent}</p>
                `;
                summaryResult.appendChild(div);
            });

            resultBadge.textContent = `${summaryList.length}문장 요약 완료`;
            resultContainer.classList.remove('hidden');
        }

        function showStatus(show) {
            if (show) {
                statusMessage.classList.remove('hidden');
                summarizeBtn.disabled = true;
            } else {
                statusMessage.classList.add('hidden');
                summarizeBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
