<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Analyzer</title>
    <!-- PDF.js & JSZip CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #f3f4f6;
            color: #1f2937;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: #ffffff;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
        }

        .header {
            margin-bottom: 28px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 800;
            color: #2e1065;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 14px;
            color: #6b7280;
        }

        /* Upload Area */
        .upload-area {
            border: 2px dashed #e5e7eb;
            background-color: #fafafa;
            border-radius: 16px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .upload-area:hover {
            border-color: #8b5cf6;
            background-color: #f5f3ff;
        }

        .upload-area input {
            display: none;
        }

        .upload-icon-wrapper {
            width: 48px;
            height: 48px;
            background-color: #ede9fe;
            color: #7c3aed;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px auto;
        }

        .upload-title {
            font-size: 15px;
            font-weight: 600;
            color: #374151;
        }

        .upload-sub {
            font-size: 13px;
            color: #9ca3af;
            margin-top: 4px;
        }

        /* Loading Spinner */
        .loading {
            display: none;
            text-align: center;
            padding: 30px 0;
            color: #6d28d9;
            font-weight: 600;
            font-size: 15px;
        }

        /* Results Section */
        .results-section {
            display: none;
        }

        /* File Info Banner */
        .file-banner {
            display: flex;
            align-items: center;
            background-color: #f9fafb;
            border: 1px solid #f3f4f6;
            padding: 14px 18px;
            border-radius: 14px;
            margin-bottom: 20px;
        }

        .file-icon {
            width: 40px;
            height: 40px;
            background-color: #ddd6fe;
            color: #6d28d9;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 14px;
            flex-shrink: 0;
        }

        .file-details {
            overflow: hidden;
        }

        .file-name {
            font-size: 14px;
            font-weight: 700;
            color: #111827;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-size {
            font-size: 12px;
            color: #6b7280;
            margin-top: 2px;
        }

        /* Grid Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background-color: #f9fafb;
            border: 1px solid #f3f4f6;
            border-radius: 16px;
            padding: 18px;
            display: flex;
            align-items: flex-start;
            gap: 14px;
        }

        .stat-icon {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-weight: bold;
        }

        /* Icon Variants */
        .icon-red { background-color: #fef2f2; color: #ef4444; }
        .icon-orange { background-color: #fff7ed; color: #f97316; }
        .icon-green { background-color: #f0fdf4; color: #22c55e; }
        .icon-blue { background-color: #f0f9ff; color: #0284c7; }
        .icon-purple { background-color: #faf5ff; color: #a855f7; }

        .stat-content {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 13px;
            color: #6b7280;
            font-weight: 500;
        }

        .stat-value {
            font-size: 22px;
            font-weight: 800;
            color: #111827;
            margin-top: 2px;
            line-height: 1.2;
        }

        .stat-sublabel {
            font-size: 11px;
            color: #9ca3af;
            margin-top: 2px;
        }

        /* Action Button & Footer */
        .action-btn {
            width: 100%;
            padding: 14px;
            background-color: transparent;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            color: #4b5563;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            background-color: #f9fafb;
            border-color: #d1d5db;
        }

        .footer-note {
            text-align: center;
            font-size: 12px;
            color: #9ca3af;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Document Analyzer</h1>
        <p>Upload your PDF or DOCX file to get instant statistics.</p>
    </div>

    <!-- Upload Box -->
    <div class="upload-area" id="dropZone">
        <div class="upload-icon-wrapper">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
            </svg>
        </div>
        <div class="upload-title">Click to upload or drag & drop</div>
        <div class="upload-sub">Supports PDF, DOCX</div>
        <input type="file" id="fileInput" accept=".pdf, .docx">
    </div>

    <!-- Loading state -->
    <div class="loading" id="loading">Analyzing document...</div>

    <!-- Results Section -->
    <div class="results-section" id="resultsSection">
        <!-- File Info Banner -->
        <div class="file-banner">
            <div class="file-icon">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                </svg>
            </div>
            <div class="file-details">
                <div class="file-name" id="fileName">document.pdf</div>
                <div class="file-size" id="fileSize">0 KB</div>
            </div>
        </div>

        <!-- 5 Stats Cards Grid -->
        <div class="stats-grid">
            <!-- 1. Total Chars -->
            <div class="stat-card">
                <div class="stat-icon icon-red">
                    <span style="font-size: 18px;">A</span>
                </div>
                <div class="stat-content">
                    <span class="stat-label">Characters</span>
                    <span class="stat-value" id="valTotalChars">0</span>
                    <span class="stat-sublabel">(with spaces)</span>
                </div>
            </div>

            <!-- 2. Words -->
            <div class="stat-card">
                <div class="stat-icon icon-green">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
                    </svg>
                </div>
                <div class="stat-content">
                    <span class="stat-label">Words</span>
                    <span class="stat-value" id="valWords">0</span>
                </div>
            </div>

            <!-- 3. Chars No Spaces -->
            <div class="stat-card">
                <div class="stat-icon icon-orange">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"></path>
                    </svg>
                </div>
                <div class="stat-content">
                    <span class="stat-label">Characters</span>
                    <span class="stat-value" id="valNoSpaceChars">0</span>
                    <span class="stat-sublabel">(no spaces)</span>
                </div>
            </div>

            <!-- 4. Images -->
            <div class="stat-card">
                <div class="stat-icon icon-purple">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                    </svg>
                </div>
                <div class="stat-content">
                    <span class="stat-label">Images</span>
                    <span class="stat-value" id="valImages">0</span>
                </div>
            </div>

            <!-- 5. Spaces -->
            <div class="stat-card">
                <div class="stat-icon icon-blue">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M8 7h8M8 12h8M8 17h8"></path>
                    </svg>
                </div>
                <div class="stat-content">
                    <span class="stat-label">Spaces</span>
                    <span class="stat-value" id="valSpaces">0</span>
                </div>
            </div>
        </div>

        <!-- Action Button -->
        <button class="action-btn" id="resetBtn">Analyze Another File</button>

        <div class="footer-note">Analyzed locally in your browser</div>
    </div>
</div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const loading = document.getElementById('loading');
    const resultsSection = document.getElementById('resultsSection');
    const resetBtn = document.getElementById('resetBtn');

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => e.preventDefault());
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
    });

    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) handleFile(e.target.files[0]);
    });

    resetBtn.addEventListener('click', () => {
        fileInput.value = '';
        resultsSection.style.display = 'none';
        dropZone.style.display = 'block';
    });

    async function handleFile(file) {
        const ext = file.name.split('.').pop().toLowerCase();
        if (ext !== 'pdf' && ext !== 'docx') {
            alert('PDF 또는 DOCX 파일만 선택할 수 있습니다.');
            return;
        }

        dropZone.style.display = 'none';
        loading.style.display = 'block';

        try {
            const arrayBuffer = await file.arrayBuffer();
            let text = "";
            let imageCount = 0;

            if (ext === 'pdf') {
                const res = await processPDF(arrayBuffer);
                text = res.text;
                imageCount = res.imageCount;
            } else if (ext === 'docx') {
                const res = await processDOCX(arrayBuffer);
                text = res.text;
                imageCount = res.imageCount;
            }

            renderResults(file, text, imageCount);
        } catch (err) {
            alert('파일 분석에 실패했습니다: ' + err.message);
            dropZone.style.display = 'block';
        } finally {
            loading.style.display = 'none';
        }
    }

    async function processPDF(arrayBuffer) {
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        let text = '';
        let imageCount = 0;

        for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const textContent = await page.getTextContent();
            text += textContent.items.map(item => item.str).join(' ') + '\n';

            const ops = await page.getOperatorList();
            for (let j = 0; j < ops.fnArray.length; j++) {
                if (ops.fnArray[j] === pdfjsLib.OPS.paintImageXObject || 
                    ops.fnArray[j] === pdfjsLib.OPS.paintInlineImageXObject) {
                    imageCount++;
                }
            }
        }
        return { text, imageCount };
    }

    async function processDOCX(arrayBuffer) {
        const zip = await JSZip.loadAsync(arrayBuffer);
        let text = '';
        let imageCount = 0;

        const mediaFolder = zip.folder("word/media");
        if (mediaFolder) {
            mediaFolder.forEach(() => imageCount++);
        }

        const docXmlFile = zip.file("word/document.xml");
        if (docXmlFile) {
            const xmlText = await docXmlFile.async("text");
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(xmlText, "text/xml");
            const textNodes = xmlDoc.getElementsByTagName("w:t");
            for (let node of textNodes) {
                text += node.textContent + " ";
            }
        }
        return { text, imageCount };
    }

    function renderResults(file, text, imageCount) {
        const totalChars = text.length;
        const spaces = (text.match(/\s/g) || []).length;
        const noSpaceChars = totalChars - spaces;
        const words = text.trim() ? text.trim().split(/\s+/).length : 0;

        // File info
        document.getElementById('fileName').innerText = file.name;
        document.getElementById('fileSize').innerText = (file.size / 1024).toFixed(2) + ' KB';

        // Stats
        document.getElementById('valTotalChars').innerText = totalChars.toLocaleString();
        document.getElementById('valNoSpaceChars').innerText = noSpaceChars.toLocaleString();
        document.getElementById('valWords').innerText = words.toLocaleString();
        document.getElementById('valSpaces').innerText = spaces.toLocaleString();
        document.getElementById('valImages').innerText = imageCount.toLocaleString();

        resultsSection.style.display = 'block';
    }
</script>

</body>
</html>
