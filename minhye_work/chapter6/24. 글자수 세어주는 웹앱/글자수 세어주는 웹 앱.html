<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나나컴퍼니 - 글자 수 & 바이트 세기</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 상단 헤더 영역 (왼쪽 상단 회사명 표시) */
        header {
            width: 100%;
            background-color: #ffffff;
            padding: 16px 24px;
            border-bottom: 1px solid #e1e5ee;
            display: flex;
            align-items: center;
        }

        .company-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: #2563eb; /* 상징적인 블루 컬러 */
            letter-spacing: -0.5px;
        }

        /* 메인 콘텐츠 영역 */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 650px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        h1 {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 8px;
            text-align: center;
        }

        p.subtitle {
            font-size: 0.9rem;
            color: #666;
            text-align: center;
            margin-bottom: 24px;
        }

        textarea {
            width: 100%;
            height: 220px;
            padding: 16px;
            font-size: 1rem;
            border: 2px solid #e1e5ee;
            border-radius: 12px;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s ease;
            line-height: 1.5;
        }

        textarea:focus {
            border-color: #2563eb;
        }

        .result-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 20px;
        }

        .card {
            background-color: #f8fafc;
            padding: 16px 10px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #edf2f7;
        }

        .card .title {
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 6px;
        }

        .card .count {
            font-size: 1.4rem;
            font-weight: bold;
            color: #1e293b;
        }

        .card.highlight {
            background-color: #eef6ff;
            border-color: #d0e3ff;
        }

        .card.highlight .count {
            color: #2563eb;
        }

        .rule-info {
            margin-top: 16px;
            font-size: 0.8rem;
            color: #888;
            text-align: right;
        }
    </style>
</head>
<body>

    <!-- 왼쪽 상단 회사명 표시 헤더 -->
    <header>
        <div class="company-name">나나컴퍼니</div>
    </header>

    <main>
        <div class="container">
            <h1>📝 글자 수 & 바이트 계산기</h1>
            <p class="subtitle">텍스트를 입력하면 실시간으로 글자 수와 바이트 수를 세어줍니다.</p>

            <textarea id="inputText" placeholder="여기에 텍스트를 입력하거나 붙여넣으세요..."></textarea>

            <div class="result-board">
                <div class="card">
                    <div class="title">공백 포함</div>
                    <div class="count" id="charWithSpace">0</div>
                </div>
                <div class="card">
                    <div class="title">공백 제외</div>
                    <div class="count" id="charWithoutSpace">0</div>
                </div>
                <div class="card highlight">
                    <div class="title">바이트 (Byte)</div>
                    <div class="count" id="byteCount">0</div>
                </div>
            </div>

            <div class="rule-info">
                * 한글/기타 언어: 2 Byte | 영문/숫자/공백/줄바꿈: 1 Byte
            </div>
        </div>
    </main>

    <script>
        const inputText = document.getElementById('inputText');
        const charWithSpace = document.getElementById('charWithSpace');
        const charWithoutSpace = document.getElementById('charWithoutSpace');
        const byteCount = document.getElementById('byteCount');

        inputText.addEventListener('input', () => {
            const text = inputText.value;

            // 1. 공백 포함 글자 수
            const totalChars = text.length;

            // 2. 공백 제외 글자 수
            const charsNoSpace = text.replace(/\s/g, '').length;

            // 3. 바이트 수 계산 (한글 2byte, 영문/숫자/공백 1byte)
            let totalBytes = 0;
            for (let i = 0; i < text.length; i++) {
                const charCode = text.charCodeAt(i);
                if (charCode > 127) {
                    totalBytes += 2;
                } else {
                    totalBytes += 1;
                }
            }

            // 화면에 업데이트
            charWithSpace.textContent = totalChars.toLocaleString();
            charWithoutSpace.textContent = charsNoSpace.toLocaleString();
            byteCount.textContent = totalBytes.toLocaleString();
        });
    </script>

</body>
</html>
