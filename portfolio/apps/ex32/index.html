<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹 오디오 에디터 (Audio Editor)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- WaveSurfer.js CDN (파형 시각화) -->
    <script src="https://unpkg.com/wavesurfer.js@7"></script>
    <!-- WaveSurfer Regions Plugin -->
    <script src="https://unpkg.com/wavesurfer.js@7/dist/plugins/regions.min.js"></script>
    <!-- lamejs CDN (MP3 인코딩용) -->
    <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center py-10 px-4">

    <div class="max-w-3xl w-full bg-white rounded-xl shadow-md p-6 space-y-6">
        <h1 class="text-2xl font-bold text-gray-800 text-center">🎵 웹 오디오 에디터</h1>
        <p class="text-sm text-gray-500 text-center">오디오 파일을 업로드하여 구간 자르기, 볼륨 조절 및 포맷 변환(WAV/MP3)을 진행해보세요.</p>

        <!-- 1. 파일 업로드 영역 -->
        <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center cursor-pointer hover:border-indigo-500 transition" id="drop-zone">
            <input type="file" id="audio-input" accept="audio/*" class="hidden">
            <label for="audio-input" class="cursor-pointer">
                <div class="text-indigo-600 mb-2">
                    <svg class="w-12 h-12 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                    </svg>
                </div>
                <span class="text-gray-700 font-medium">클릭하거나 오디오 파일(MP3, WAV 등)을 여기에 드래그하세요</span>
            </label>
        </div>

        <!-- 파형 및 플레이어 영역 (파일 선택 시 활성화) -->
        <div id="editor-section" class="hidden space-y-6">
            <!-- 파형 표시 -->
            <div class="bg-gray-50 p-4 rounded-lg">
                <div id="waveform" class="w-full"></div>
                <div class="flex justify-between text-xs text-gray-500 mt-2">
                    <span id="time-current">00:00</span>
                    <span id="time-total">00:00</span>
                </div>
            </div>

            <!-- 재생 컨트롤 -->
            <div class="flex justify-center space-x-4">
                <button id="btn-play" class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700 transition font-medium">재생 / 일시정지</button>
            </div>

            <!-- 편집 설정 카드 -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-gray-50 p-4 rounded-lg">
                <!-- 볼륨 조절 -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">
                        🔊 볼륨 조절: <span id="volume-val" class="text-indigo-600">100%</span>
                    </label>
                    <input type="range" id="volume-slider" min="0" max="2" step="0.05" value="1" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                </div>

                <!-- 포맷 선택 -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">🎼 변환할 포맷</label>
                    <select id="format-select" class="w-full border border-gray-300 rounded-lg p-2 bg-white text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="wav">WAV (무손실)</option>
                        <option value="mp3">MP3</option>
                    </select>
                </div>

                <!-- 구간 자르기 (Trim) -->
                <div class="md:col-span-2 grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">✂️ 자르기 시작 시간 (초)</label>
                        <input type="number" id="trim-start" min="0" step="0.1" value="0" class="w-full border border-gray-300 rounded-lg p-2 bg-white">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">✂️ 자르기 종료 시간 (초)</label>
                        <input type="number" id="trim-end" min="0" step="0.1" value="0" class="w-full border border-gray-300 rounded-lg p-2 bg-white">
                    </div>
                </div>
            </div>

            <!-- 내보내기 버튼 -->
            <button id="btn-process" class="w-full bg-emerald-600 text-white py-3 rounded-lg font-bold hover:bg-emerald-700 transition">
                ⚡ 편집 적용 및 파일 생성하기
            </button>
        </div>

        <!-- 결과 및 다운로드 영역 -->
        <div id="result-section" class="hidden border-t pt-6 text-center space-y-4">
            <h2 class="text-lg font-bold text-gray-800">✅ 편집이 완료되었습니다!</h2>
            <audio id="result-audio" controls class="w-full"></audio>
            <div>
                <a id="btn-download" class="inline-block bg-indigo-600 text-white px-6 py-2.5 rounded-lg font-medium hover:bg-indigo-700 transition" download="edited_audio">
                    ⬇️ 다운로드
                </a>
            </div>
        </div>
    </div>

    <script>
        let wavesurfer, wsRegions, activeRegion;
        let audioContext = new (window.AudioContext || window.webkitAudioContext)();
        let originalAudioBuffer = null;

        const audioInput = document.getElementById('audio-input');
        const editorSection = document.getElementById('editor-section');
        const resultSection = document.getElementById('result-section');
        const volumeSlider = document.getElementById('volume-slider');
        const volumeVal = document.getElementById('volume-val');
        const trimStartInput = document.getElementById('trim-start');
        const trimEndInput = document.getElementById('trim-end');
        const btnPlay = document.getElementById('btn-play');
        const btnProcess = document.getElementById('btn-process');
        const formatSelect = document.getElementById('format-select');

        // WaveSurfer 초기화
        function initWaveSurfer() {
            if (wavesurfer) wavesurfer.destroy();

            wsRegions = WaveSurfer.Regions.create();

            wavesurfer = WaveSurfer.create({
                container: '#waveform',
                waveColor: '#cbd5e1',
                progressColor: '#6366f1',
                cursorColor: '#4338ca',
                height: 100,
                plugins: [wsRegions]
            });

            wavesurfer.on('audioprocess', () => {
                document.getElementById('time-current').textContent = formatTime(wavesurfer.getCurrentTime());
            });

            wavesurfer.on('ready', () => {
                const duration = wavesurfer.getDuration();
                document.getElementById('time-total').textContent = formatTime(duration);
                trimStartInput.value = 0;
                trimEndInput.value = duration.toFixed(1);

                // 구간 선택 영역 생성
                wsRegions.clearRegions();
                activeRegion = wsRegions.addRegion({
                    start: 0,
                    end: duration,
                    color: 'rgba(99, 102, 241, 0.2)',
                    drag: true,
                    resize: true
                });

                activeRegion.on('update-end', () => {
                    trimStartInput.value = activeRegion.start.toFixed(1);
                    trimEndInput.value = activeRegion.end.toFixed(1);
                });
            });
        }

        // 시간 포맷 변환 (초 -> mm:ss)
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        // 파일 선택 시
        audioInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            initWaveSurfer();
            const fileUrl = URL.createObjectURL(file);
            wavesurfer.load(fileUrl);

            const arrayBuffer = await file.arrayBuffer();
            originalAudioBuffer = await audioContext.decodeAudioData(arrayBuffer);

            editorSection.classList.remove('hidden');
            resultSection.classList.add('hidden');
        });

        // 재생/일시정지
        btnPlay.addEventListener('click', () => {
            wavesurfer.playPause();
        });

        // 볼륨 슬라이더 변경 시
        volumeSlider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            volumeVal.textContent = Math.round(val * 100) + '%';
            wavesurfer.setVolume(val);
        });

        // Trim 입력 창 변경 시 파형 영역 업데이트
        trimStartInput.addEventListener('change', updateRegionFromInput);
        trimEndInput.addEventListener('change', updateRegionFromInput);

        function updateRegionFromInput() {
            if (activeRegion) {
                const start = parseFloat(trimStartInput.value) || 0;
                const end = parseFloat(trimEndInput.value) || wavesurfer.getDuration();
                activeRegion.setOptions({ start, end });
            }
        }

        // 편집 적용 및 다운로드 파일 생성
        btnProcess.addEventListener('click', async () => {
            if (!originalAudioBuffer) return;

            btnProcess.innerText = '⏳ 처리 중...';
            btnProcess.disabled = true;

            setTimeout(() => {
                const startSec = parseFloat(trimStartInput.value);
                const endSec = parseFloat(trimEndInput.value);
                const volumeMultiplier = parseFloat(volumeSlider.value);
                const format = formatSelect.value;

                // 오디오 슬라이싱 및 볼륨 처리
                const editedBuffer = processAudio(originalAudioBuffer, startSec, endSec, volumeMultiplier);

                let outputBlob;
                if (format === 'mp3') {
                    outputBlob = bufferToMp3(editedBuffer);
                } else {
                    outputBlob = bufferToWave(editedBuffer);
                }

                // 결과 노출
                const resultUrl = URL.createObjectURL(outputBlob);
                const resultAudio = document.getElementById('result-audio');
                const btnDownload = document.getElementById('btn-download');

                resultAudio.src = resultUrl;
                btnDownload.href = resultUrl;
                btnDownload.download = `edited_audio.${format}`;

                resultSection.classList.remove('hidden');
                btnProcess.innerText = '⚡ 편집 적용 및 파일 생성하기';
                btnProcess.disabled = false;
            }, 100);
        });

        // 오디오 자르기 및 볼륨 조절 함수
        function processAudio(buffer, startSec, endSec, volume) {
            const sampleRate = buffer.sampleRate;
            const channels = buffer.numberOfChannels;
            
            const startSample = Math.floor(startSec * sampleRate);
            const endSample = Math.floor(endSec * sampleRate);
            const frameCount = Math.max(0, endSample - startSample);

            const newBuffer = audioContext.createBuffer(channels, frameCount, sampleRate);

            for (let c = 0; c < channels; c++) {
                const sourceData = buffer.getChannelData(c);
                const destData = newBuffer.getChannelData(c);

                for (let i = 0; i < frameCount; i++) {
                    const sample = sourceData[startSample + i] * volume;
                    // Clipping 방지
                    destData[i] = Math.max(-1, Math.min(1, sample));
                }
            }
            return newBuffer;
        }

        // AudioBuffer -> WAV Blob 변환
        function bufferToWave(abuffer) {
            const numOfChan = abuffer.numberOfChannels;
            const length = abuffer.length * numOfChan * 2 + 44;
            const buffer = new ArrayBuffer(length);
            const view = new DataView(buffer);
            let channels = [], i, sample, offset = 0, pos = 0;

            function setUint16(data) { view.setUint16(pos, data, true); pos += 2; }
            function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }

            setUint32(0x46464952); // "RIFF"
            setUint32(length - 8);
            setUint32(0x45564157); // "WAVE"
            setUint32(0x20746d66); // "fmt " chunk
            setUint32(16);
            setUint16(1); // PCM
            setUint16(numOfChan);
            setUint32(abuffer.sampleRate);
            setUint32(abuffer.sampleRate * 2 * numOfChan);
            setUint16(numOfChan * 2);
            setUint16(16);
            setUint32(0x61746164); // "data" chunk
            setUint32(length - pos - 4);

            for (i = 0; i < abuffer.numberOfChannels; i++) channels.push(abuffer.getChannelData(i));

            while (pos < length) {
                for (i = 0; i < numOfChan; i++) {
                    sample = Math.max(-1, Math.min(1, channels[i][offset]));
                    sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
                    view.setInt16(pos, sample, true);
                    pos += 2;
                }
                offset++;
            }
            return new Blob([buffer], { type: "audio/wav" });
        }

        // AudioBuffer -> MP3 Blob 변환 (lamejs 활용)
        function bufferToMp3(abuffer) {
            const channels = abuffer.numberOfChannels;
            const sampleRate = abuffer.sampleRate;
            const kbps = 128;
            const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
            const mp3Data = [];

            const samplesL = abuffer.getChannelData(0);
            const samplesR = channels > 1 ? abuffer.getChannelData(1) : samplesL;

            const sampleCount = abuffer.length;
            const left = new Int16Array(sampleCount);
            const right = new Int16Array(sampleCount);

            for (let i = 0; i < sampleCount; i++) {
                let sL = Math.max(-1, Math.min(1, samplesL[i]));
                left[i] = sL < 0 ? sL * 0x8000 : sL * 0x7FFF;
                if (channels > 1) {
                    let sR = Math.max(-1, Math.min(1, samplesR[i]));
                    right[i] = sR < 0 ? sR * 0x8000 : sR * 0x7FFF;
                }
            }

            const sampleBlockSize = 1152;
            for (let i = 0; i < sampleCount; i += sampleBlockSize) {
                const leftChunk = left.subarray(i, i + sampleBlockSize);
                let mp3buf;
                if (channels === 2) {
                    const rightChunk = right.subarray(i, i + sampleBlockSize);
                    mp3buf = mp3encoder.encodeBuffer(leftChunk, rightChunk);
                } else {
                    mp3buf = mp3encoder.encodeBuffer(leftChunk);
                }
                if (mp3buf.length > 0) mp3Data.push(mp3buf);
            }

            const endBuf = mp3encoder.flush();
            if (endBuf.length > 0) mp3Data.push(endBuf);

            return new Blob(mp3Data, { type: 'audio/mp3' });
        }
    </script>
</body>
</html>
