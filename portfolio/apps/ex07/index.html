<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Image Resizer</title>
    <!-- JSZip 라이브러리 (ZIP 압축용) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- Google Fonts (Noto Sans KR) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-light: #e0e7ff;
            --success: #10b981;
            --success-hover: #059669;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius-lg: 16px;
            --radius-md: 10px;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 1 & 2. 헤더 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 40px;
            background-color: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header .logo a {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        header .logo img {
            height: 36px;
            object-fit: contain;
        }

        header .title {
            font-size: 1.15rem;
            font-weight: 700;
            background: linear-gradient(135deg, #4f46e5, #9333ea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        /* 레이아웃 컨테이너 */
        .container {
            max-width: 1200px;
            width: 100%;
            margin: 30px auto;
            padding: 0 24px;
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 24px;
            flex: 1;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        /* 카드 공통 스타일 */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            padding: 24px;
            transition: box-shadow 0.2s ease;
        }

        .card:hover {
            box-shadow: var(--shadow-md);
        }

        .section-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 16px;
            background-color: var(--primary);
            border-radius: 2px;
        }

        .control-group {
            margin-bottom: 24px;
        }

        .control-group:last-child {
            margin-bottom: 0;
        }

        /* 칩 타입 라디오 버튼 스타일 */
        .chip-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .chip-group.two-cols {
            grid-template-columns: repeat(2, 1fr);
        }

        .chip-option {
            position: relative;
        }

        .chip-option input[type="radio"] {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .chip-label {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 12px;
            background-color: #f1f5f9;
            border: 1px solid transparent;
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .chip-option input[type="radio"]:checked + .chip-label {
            background-color: var(--primary-light);
            border-color: var(--primary);
            color: var(--primary);
            font-weight: 700;
        }

        .chip-label:hover {
            background-color: #e2e8f0;
        }

        /* 커스텀 비율 입력창 */
        .custom-ratio-inputs {
            display: none;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
            background: #f8fafc;
            padding: 10px;
            border-radius: var(--radius-md);
            border: 1px dashed var(--border);
        }

        .custom-ratio-inputs input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            text-align: center;
            font-weight: 600;
            outline: none;
        }

        .custom-ratio-inputs input:focus {
            border-color: var(--primary);
        }

        /* 색상 선택기 스타일 */
        .color-picker-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 12px;
            padding: 10px 14px;
            background: #f8fafc;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
        }

        .color-picker-wrapper label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        .color-picker-wrapper input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            background: none;
        }

        .color-picker-wrapper input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        .color-picker-wrapper input[type="color"]::-webkit-color-swatch {
            border: 2px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 0 1px var(--border);
        }

        /* 메인 콘텐츠 영역 (우측) */
        .main-content {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* 3. 업로드 영역 */
        .drop-zone {
            border: 2px dashed #cbd5e1;
            background-color: #ffffff;
            border-radius: var(--radius-lg);
            padding: 48px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: var(--primary);
            background-color: var(--primary-light);
            transform: translateY(-2px);
        }

        .upload-icon {
            width: 56px;
            height: 56px;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 4px;
        }

        .drop-zone p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 4px rgba(99, 102, 241, 0.2);
        }

        .btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 6px rgba(99, 102, 241, 0.3);
        }

        .btn:disabled {
            background-color: #cbd5e1;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        /* 8, 9, 10. 리스트 영역 */
        .list-card {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .item-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 450px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .item-card {
            display: flex;
            align-items: center;
            background: #f8fafc;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            gap: 16px;
            transition: all 0.2s ease;
        }

        .item-card:hover {
            background: #ffffff;
            border-color: #cbd5e1;
        }

        .thumbnail {
            width: 52px;
            height: 52px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: #fff;
        }

        .item-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .item-name-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-name {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 220px;
        }

        .item-status {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--primary);
        }

        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background-color: #e2e8f0;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), #8b5cf6);
            border-radius: 3px;
            transition: width 0.1s linear;
        }

        .btn-sm {
            padding: 6px 14px;
            font-size: 0.8rem;
            border-radius: 6px;
        }

        .btn-download-all {
            background-color: var(--success);
            box-shadow: 0 2px 4px rgba(16, 185, 129, 0.2);
        }

        .btn-download-all:hover {
            background-color: var(--success-hover);
            box-shadow: 0 4px 6px rgba(16, 185, 129, 0.3);
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- 헤더 -->
    <header>
        <div class="logo">
            <a href="https://nanalab.kr" target="_blank" rel="noopener noreferrer">
                <img src="logo.png" alt="Logo" onerror="this.src='https://via.placeholder.com/120x40/6366f1/ffffff?text=nanalab'">
            </a>
        </div>
        <div class="title">Smart Image Resizer</div>
    </header>

    <div class="container">
        <!-- 설정 패널 (좌측) -->
        <div class="card">
            <!-- 4. 비율 선택 -->
            <div class="control-group">
                <div class="section-title">캔버스 비율</div>
                <div class="chip-group" id="ratio-group">
                    <label class="chip-option">
                        <input type="radio" name="ratio" value="1:1" checked>
                        <span class="chip-label">1 : 1</span>
                    </label>
                    <label class="chip-option">
                        <input type="radio" name="ratio" value="3:4">
                        <span class="chip-label">3 : 4</span>
                    </label>
                    <label class="chip-option">
                        <input type="radio" name="ratio" value="4:3">
                        <span class="chip-label">4 : 3</span>
                    </label>
                    <label class="chip-option">
                        <input type="radio" name="ratio" value="9:16">
                        <span class="chip-label">9 : 16</span>
                    </label>
                    <label class="chip-option">
                        <input type="radio" name="ratio" value="16:9">
                        <span class="chip-label">16 : 9</span>
                    </label>
                    <label class="chip-option">
                        <input type="radio" name="ratio" value="custom">
                        <span class="chip-label">커스텀</span>
                    </label>
                </div>
                <div class="custom-ratio-inputs" id="custom-ratio-inputs">
                    <input type="number" id="custom-w" placeholder="너비" value="1080" min="1">
                    <span style="color: var(--text-muted); font-weight: 600;">:</span>
                    <input type="number" id="custom-h" placeholder="높이" value="1080" min="1">
                </div>
            </div>

            <!-- 5, 6, 7. 방식 선택 -->
            <div class="control-group">
                <div class="section-title">리사이즈 방식</div>
                <div class="chip-group two-cols">
                    <label class="chip-option">
                        <input type="radio" name="mode" value="padding" checked>
                        <span class="chip-label">Padding (여백)</span>
                    </label>
                    <label class="chip-option">
                        <input type="radio" name="mode" value="crop">
                        <span class="chip-label">Crop (자르기)</span>
                    </label>
                </div>

                <!-- 여백 색상 -->
                <div class="color-picker-wrapper" id="color-picker-group">
                    <label for="bg-color-input">여백 색상 지정</label>
                    <input type="color" id="bg-color-input" value="#FFFFFF">
                </div>
            </div>
        </div>

        <!-- 메인 콘텐츠 (우측) -->
        <div class="main-content">
            <!-- 3. 업로드 영역 -->
            <div class="drop-zone" id="drop-zone">
                <div class="upload-icon">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                </div>
                <div>
                    <p style="font-weight: 600; color: var(--text-main); margin-bottom: 4px;">사진 파일을 여기에 드롭하세요</p>
                    <p style="font-size: 0.85rem;">PNG, JPG, WEBP 형식 지원</p>
                </div>
                <button class="btn" onclick="document.getElementById('file-input').click()">컴퓨터에서 찾기</button>
                <input type="file" id="file-input" multiple accept="image/*" style="display: none;">
            </div>

            <!-- 8. 작업 목록 -->
            <div class="card list-card">
                <div class="list-header">
                    <div class="section-title" style="margin-bottom: 0;">작업 목록</div>
                    <button class="btn btn-download-all" id="btn-download-all" disabled>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        일괄 다운로드 (.zip)
                    </button>
                </div>
                <div class="item-list" id="item-list">
                    <div class="empty-state" id="empty-state">업로드된 사진이 없습니다.</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const ratioGroup = document.getElementById('ratio-group');
        const customRatioInputs = document.getElementById('custom-ratio-inputs');
        const colorPickerGroup = document.getElementById('color-picker-group');
        const itemList = document.getElementById('item-list');
        const emptyState = document.getElementById('empty-state');
        const btnDownloadAll = document.getElementById('btn-download-all');

        let processedFiles = [];

        // 비율 선택 토글
        ratioGroup.addEventListener('change', (e) => {
            if (e.target.value === 'custom') {
                customRatioInputs.style.display = 'flex';
            } else {
                customRatioInputs.style.display = 'none';
            }
        });

        // 모드 선택 토글
        document.querySelectorAll('input[name="mode"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                colorPickerGroup.style.display = e.target.value === 'padding' ? 'flex' : 'none';
            });
        });

        // 드래그 앤 드롭
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) handleFiles(e.target.files);
        });

        function handleFiles(files) {
            const imageFiles = Array.from(files).filter(f => f.type.startsWith('image/'));
            if (imageFiles.length === 0) {
                alert('이미지 파일만 업로드 가능합니다.');
                return;
            }

            if (emptyState) emptyState.style.display = 'none';

            imageFiles.forEach(file => processImage(file));
        }

        function getTargetRatio() {
            const selectedRatio = document.querySelector('input[name="ratio"]:checked').value;
            if (selectedRatio === 'custom') {
                const w = parseFloat(document.getElementById('custom-w').value) || 1;
                const h = parseFloat(document.getElementById('custom-h').value) || 1;
                return w / h;
            } else {
                const [w, h] = selectedRatio.split(':').map(Number);
                return w / h;
            }
        }

        function processImage(file) {
            const targetRatio = getTargetRatio();
            const mode = document.querySelector('input[name="mode"]:checked').value;
            const bgColor = document.getElementById('bg-color-input').value;

            // DOM 생성
            const itemCard = document.createElement('div');
            itemCard.className = 'item-card';

            const imgThumb = document.createElement('img');
            imgThumb.className = 'thumbnail';

            const itemInfo = document.createElement('div');
            itemInfo.className = 'item-info';

            const nameRow = document.createElement('div');
            nameRow.className = 'item-name-row';

            const itemName = document.createElement('div');
            itemName.className = 'item-name';
            itemName.textContent = file.name;

            const itemStatus = document.createElement('div');
            itemStatus.className = 'item-status';
            itemStatus.textContent = '0%';

            nameRow.appendChild(itemName);
            nameRow.appendChild(itemStatus);

            const progressBarBg = document.createElement('div');
            progressBarBg.className = 'progress-bar-bg';

            const progressBarFill = document.createElement('div');
            progressBarFill.className = 'progress-bar-fill';
            progressBarBg.appendChild(progressBarFill);

            itemInfo.appendChild(nameRow);
            itemInfo.appendChild(progressBarBg);

            const downloadBtn = document.createElement('button');
            downloadBtn.className = 'btn btn-sm';
            downloadBtn.textContent = '다운로드';
            downloadBtn.disabled = true;

            itemCard.appendChild(imgThumb);
            itemCard.appendChild(itemInfo);
            itemCard.appendChild(downloadBtn);
            itemList.appendChild(itemCard);

            // 이미지 처리
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    imgThumb.src = e.target.result;

                    let progress = 0;
                    const interval = setInterval(() => {
                        progress += 10;
                        progressBarFill.style.width = progress + '%';
                        itemStatus.textContent = progress + '%';

                        if (progress >= 100) {
                            clearInterval(interval);
                            itemStatus.textContent = '완료';
                            itemStatus.style.color = 'var(--success)';

                            const blob = renderToCanvas(img, targetRatio, mode, bgColor, file.type);
                            const downloadUrl = URL.createObjectURL(blob);

                            downloadBtn.disabled = false;
                            downloadBtn.onclick = () => {
                                const a = document.createElement('a');
                                a.href = downloadUrl;
                                a.download = `resized_${file.name}`;
                                a.click();
                            };

                            processedFiles.push({
                                name: `resized_${file.name}`,
                                blob: blob
                            });

                            checkAllCompleted();
                        }
                    }, 25);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function renderToCanvas(img, targetRatio, mode, bgColor, fileType) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            const imgW = img.width;
            const imgH = img.height;
            const imgRatio = imgW / imgH;

            let canvasW, canvasH;

            if (mode === 'padding') {
                if (imgRatio > targetRatio) {
                    canvasW = imgW;
                    canvasH = imgW / targetRatio;
                } else {
                    canvasH = imgH;
                    canvasW = imgH * targetRatio;
                }

                canvas.width = canvasW;
                canvas.height = canvasH;

                ctx.fillStyle = bgColor;
                ctx.fillRect(0, 0, canvasW, canvasH);

                const drawX = (canvasW - imgW) / 2;
                const drawY = (canvasH - imgH) / 2;
                ctx.drawImage(img, drawX, drawY, imgW, imgH);

            } else if (mode === 'crop') {
                canvasW = imgW;
                canvasH = imgW / targetRatio;

                if (canvasH > imgH) {
                    canvasH = imgH;
                    canvasW = imgH * targetRatio;
                }

                canvas.width = canvasW;
                canvas.height = canvasH;

                const sx = (imgW - canvasW) / 2;
                const sy = (imgH - canvasH) / 2;

                ctx.drawImage(img, sx, sy, canvasW, canvasH, 0, 0, canvasW, canvasH);
            }

            const dataUrl = canvas.toDataURL(fileType || 'image/png');
            const byteString = atob(dataUrl.split(',')[1]);
            const mimeString = dataUrl.split(',')[0].split(':')[1].split(';')[0];
            const ab = new ArrayBuffer(byteString.length);
            const ia = new Uint8Array(ab);

            for (let i = 0; i < byteString.length; i++) {
                ia[i] = byteString.charCodeAt(i);
            }

            return new Blob([ab], { type: mimeString });
        }

        function checkAllCompleted() {
            const currentItemCount = itemList.querySelectorAll('.item-card').length;
            if (currentItemCount > 0 && processedFiles.length === currentItemCount) {
                btnDownloadAll.disabled = false;
            }
        }

        btnDownloadAll.addEventListener('click', () => {
            if (processedFiles.length === 0) return;

            const zip = new JSZip();
            processedFiles.forEach(item => {
                zip.file(item.name, item.blob);
            });

            zip.generateAsync({ type: 'blob' }).then((content) => {
                const a = document.createElement('a');
                a.href = URL.createObjectURL(content);
                a.download = 'resized_images.zip';
                a.click();
            });
        });
    </script>
</body>
</html>
