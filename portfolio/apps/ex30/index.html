<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>복불복 캐논 추첨기</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Pretendard', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      /* 화사하고 밝은 파스텔 그라데이션 배경 */
      background: linear-gradient(135deg, #e0f2fe 0%, #fef3c7 100%);
      color: #1e293b;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      margin-bottom: 8px;
      font-size: 2rem;
      color: #ff4757;
      text-shadow: 0 2px 10px rgba(255, 71, 87, 0.15);
    }

    p.subtitle {
      font-size: 0.95rem;
      color: #475569;
      margin-bottom: 24px;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      justify-content: center;
      max-width: 1000px;
      width: 100%;
    }

    /* 컨트롤 패널: 깔끔한 하얀색 카드 형태 */
    .control-panel {
      background: #ffffff;
      padding: 24px;
      border-radius: 16px;
      flex: 1;
      min-width: 280px;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
    }

    label {
      font-weight: bold;
      font-size: 0.9rem;
      color: #334155;
    }

    textarea {
      width: 100%;
      height: 140px;
      padding: 12px;
      border-radius: 10px;
      border: 1.5px solid #cbd5e1;
      background-color: #f8fafc;
      color: #0f172a;
      font-size: 0.95rem;
      resize: vertical;
      line-height: 1.4;
      transition: border-color 0.2s;
    }

    textarea:focus {
      outline: none;
      border-color: #ff4757;
      background-color: #ffffff;
    }

    button {
      padding: 14px;
      font-size: 1.05rem;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-start {
      background: linear-gradient(135deg, #ff4757, #ff6b81);
      color: white;
      box-shadow: 0 4px 12px rgba(255, 71, 87, 0.3);
    }

    .btn-start:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(255, 71, 87, 0.4);
    }

    .btn-start:disabled {
      background: #cbd5e1;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    /* 게임 판 (캔버스 컨테이너) */
    .canvas-container {
      position: relative;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
      border: 2px solid #e2e8f0;
      overflow: hidden;
    }

    canvas {
      display: block;
      background: #fafafa;
    }

    /* 결과 팝업 창 */
    .result-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(5px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      padding: 24px;
      text-align: center;
    }

    .result-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .result-title {
      font-size: 1.2rem;
      font-weight: bold;
      color: #ff4757;
      margin-bottom: 8px;
    }

    .winner-name {
      font-size: 2.4rem;
      font-weight: 800;
      color: #2e86de;
      margin-bottom: 12px;
      text-shadow: 0 2px 10px rgba(46, 134, 222, 0.2);
    }

    .result-desc {
      font-size: 0.9rem;
      color: #64748b;
      margin-bottom: 16px;
    }

    .btn-close {
      background: #10ac84;
      color: white;
      padding: 10px 28px;
      box-shadow: 0 4px 10px rgba(16, 172, 132, 0.2);
    }

    .btn-close:hover {
      background: #1dd1a1;
    }

    .ranking-list {
      margin-top: 8px;
      max-height: 140px;
      overflow-y: auto;
      width: 100%;
      font-size: 0.85rem;
      color: #334155;
      text-align: left;
      padding: 12px;
      background: #f1f5f9;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <h1>🎈 복불복 캐논 추첨기</h1>
  <p class="subtitle">대포에서 발사된 구슬 중 <strong>가장 마지막에 떨어지는 사람</strong>이 당첨!</p>

  <div class="container">
    <div class="control-panel">
      <div>
        <label for="nameInput">참가자 목록 (줄바꿈 또는 쉼표):</label>
        <textarea id="nameInput" placeholder="김철수&#10;이영희&#10;박민수&#10;정수진&#10;최동현"></textarea>
      </div>
      <button id="startBtn" class="btn-start">🎯 대포 발사!</button>
    </div>

    <div class="canvas-container">
      <canvas id="gameCanvas" width="500" height="600"></canvas>
      <div id="resultOverlay" class="result-overlay">
        <div class="result-title">🎉 최종 당첨자 (최후의 생존자) 🎉</div>
        <div id="winnerName" class="winner-name">-</div>
        <div class="result-desc">가장 마지막까지 장애물을 견뎌내고 떨어졌습니다!</div>
        <div class="ranking-list" id="rankingList"></div>
        <br>
        <button id="closeBtn" class="btn-close">확인</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const nameInput = document.getElementById('nameInput');
    const startBtn = document.getElementById('startBtn');
    const resultOverlay = document.getElementById('resultOverlay');
    const winnerNameEl = document.getElementById('winnerName');
    const rankingListEl = document.getElementById('rankingList');
    const closeBtn = document.getElementById('closeBtn');

    // 게임 변수
    let marbles = [];
    let pegs = [];
    let finishedMarbles = [];
    let isRunning = false;
    let totalParticipants = 0;

    const gravity = 0.15;
    const bounce = 0.65;
    const marbleRadius = 13;

    // 대포 위치
    const cannon = { x: canvas.width / 2, y: 40 };

    // 장애물(핀) 생성
    function createPegs() {
      pegs = [];
      const rows = 7;
      const startY = 130;
      const spacingY = 55;

      for (let r = 0; r < rows; r++) {
        const cols = (r % 2 === 0) ? 7 : 8;
        const spacingX = canvas.width / (cols + 1);
        for (let c = 0; c < cols; c++) {
          pegs.push({
            x: spacingX * (c + 1),
            y: startY + r * spacingY,
            r: 7
          });
        }
      }
    }

    // 통통 튀는 화사한 알록달록 색상들
    function getRandomColor(index) {
      const colors = [
        '#ff4757', '#2ed573', '#1e90ff', '#ffa502', 
        '#ff6b81', '#9b59b6', '#70a1ff', '#00d2d3', 
        '#ff7f50', '#1dd1a1', '#54a0ff', '#feca57'
      ];
      return colors[index % colors.length];
    }

    // 게임 초기화
    function init() {
      createPegs();
      draw();
    }

    // 발사 시작
    function startLottery() {
      const rawNames = nameInput.value.split(/[\n,]+/).map(n => n.trim()).filter(n => n.length > 0);
      if (rawNames.length < 2) {
        alert('최소 2명 이상의 참가자 이름을 입력해 주세요!');
        return;
      }

      marbles = [];
      finishedMarbles = [];
      totalParticipants = rawNames.length;
      isRunning = true;
      startBtn.disabled = true;
      resultOverlay.classList.remove('active');

      // 순차적으로 구슬 발사
      rawNames.forEach((name, i) => {
        setTimeout(() => {
          const angle = (Math.random() - 0.5) * 0.4;
          const speed = 4 + Math.random() * 2;
          marbles.push({
            id: i,
            name: name,
            x: cannon.x,
            y: cannon.y + 10,
            vx: Math.sin(angle) * speed,
            vy: Math.cos(angle) * speed,
            color: getRandomColor(i),
            finished: false
          });
        }, i * 350);
      });

      requestAnimationFrame(update);
    }

    // 프레임 업데이트
    function update() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      marbles.forEach(m => {
        if (m.finished) return;

        // 물리 법칙
        m.vy += gravity;
        m.x += m.vx;
        m.y += m.vy;

        // 벽 충돌
        if (m.x - marbleRadius < 0) {
          m.x = marbleRadius;
          m.vx = -m.vx * bounce;
        } else if (m.x + marbleRadius > canvas.width) {
          m.x = canvas.width - marbleRadius;
          m.vx = -m.vx * bounce;
        }

        // 장애물(핀) 충돌
        pegs.forEach(p => {
          const dx = m.x - p.x;
          const dy = m.y - p.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const minDist = marbleRadius + p.r;

          if (dist < minDist) {
            const overlap = minDist - dist;
            const nx = dx / dist;
            const ny = dy / dist;

            m.x += nx * overlap;
            m.y += ny * overlap;

            const dot = m.vx * nx + m.vy * ny;
            m.vx = (m.vx - 2 * dot * nx) * bounce + (Math.random() - 0.5) * 0.5;
            m.vy = (m.vy - 2 * dot * ny) * bounce;
          }
        });

        // 도착선 통과
        if (m.y + marbleRadius >= canvas.height - 30) {
          m.finished = true;
          m.y = canvas.height - 30;
          finishedMarbles.push(m);
        }
      });

      draw();

      if (finishedMarbles.length === totalParticipants && totalParticipants > 0) {
        isRunning = false;
        startBtn.disabled = false;
        showResult();
      } else {
        requestAnimationFrame(update);
      }
    }

    // 화면 그리기 (밝은 스타일 적용)
    function draw() {
      // 바닥 골라인 (화사한 민트/에메랄드 톤)
      ctx.fillStyle = '#10ac84';
      ctx.fillRect(0, canvas.height - 25, canvas.width, 25);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 12px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('🏁 FINISH LINE 🏁', canvas.width / 2, canvas.height - 8);

      // 장애물(핀) 그리기 (밝은 노란 코랄 느낌)
      pegs.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = '#ff9f43';
        ctx.shadowBlur = 4;
        ctx.shadowColor = 'rgba(255, 159, 67, 0.3)';
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.closePath();
      });

      // 대포 그리기 (귀여운 인디고/블루 톤)
      ctx.save();
      ctx.translate(cannon.x, cannon.y);
      ctx.fillStyle = '#54a0ff';
      ctx.fillRect(-15, -20, 30, 35);
      ctx.beginPath();
      ctx.arc(0, 15, 18, 0, Math.PI * 2);
      ctx.fillStyle = '#2e86de';
      ctx.fill();
      ctx.restore();

      // 구슬 및 이름 그리기
      marbles.forEach(m => {
        ctx.beginPath();
        ctx.arc(m.x, m.y, marbleRadius, 0, Math.PI * 2);
        ctx.fillStyle = m.color;
        ctx.shadowBlur = 6;
        ctx.shadowColor = 'rgba(0,0,0,0.1)';
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.closePath();

        // 밝은 배경에서도 잘 보이도록 이름 텍스트 설정
        ctx.fillStyle = '#1e293b';
        ctx.font = 'bold 11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(m.name, m.x, m.y - marbleRadius - 4);
      });
    }

    // 결과 출력
    function showResult() {
      const winner = finishedMarbles[finishedMarbles.length - 1];
      winnerNameEl.innerText = winner.name;

      rankingListEl.innerHTML = '<strong>[낙하 순서]</strong><br>' + 
        finishedMarbles.map((m, idx) => {
          const isWinner = idx === finishedMarbles.length - 1;
          return `${idx + 1}등: ${m.name} ${isWinner ? '🏆 (당첨!)' : ''}`;
        }).join('<br>');

      setTimeout(() => {
        resultOverlay.classList.add('active');
      }, 500);
    }

    // 이벤트 리스너
    startBtn.addEventListener('click', startLottery);
    closeBtn.addEventListener('click', () => {
      resultOverlay.classList.remove('active');
    });

    init();
  </script>
</body>
</html>
