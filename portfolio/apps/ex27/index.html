<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나나컴퍼니 - PDF 파일 병합기</title>
  <!-- pdf-lib 라이브러리 로드 -->
  <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      position: relative;
    }

    /* 왼쪽 상단 회사명 스타일 */
    .company-logo {
      position: absolute;
      top: 24px;
      left: 28px;
      font-size: 18px;
      font-weight: 800;
      color: #333333;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .company-logo::before {
      content: '';
      display: inline-block;
      width: 10px;
      height: 10px;
      background-color: #4a90e2;
      border-radius: 50%;
    }

    .container {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 500px;
      text-align: center;
      margin-top: 40px;
    }

    h1 {
      font-size: 24px;
      color: #333;
      margin-bottom: 20px;
    }

    /* 드래그 앤 드롭 영역 스타일 */
    .upload-box {
      border: 2px dashed #4a90e2;
      border-radius: 8px;
      padding: 35px 20px;
      background-color: #f0f7ff;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
      margin-bottom: 20px;
    }

    /* 드래그 중일 때 하이라이트 효과 */
    .upload-box.drag-over {
      background-color: #d0e5ff;
      border-color: #1c62b9;
      transform: scale(1.02);
    }

    .upload-box p {
      color: #4a90e2;
      font-weight: 600;
      font-size: 15px;
      line-height: 1.4;
      pointer-events: none; /* 드래그 이벤트 간섭 방지 */
    }

    input[type="file"] {
      display: none;
    }

    .file-list {
      text-align: left;
      margin-bottom: 20px;
      max-height: 150px;
      overflow-y: auto;
    }

    .file-item {
      background: #eef2f5;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
      color: #555;
      margin-bottom: 6px;
      word-break: break-all;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background-color: #4a90e2;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .btn:hover {
      background-color: #357abd;
    }

    .btn:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

    .status {
      margin-top: 15px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>

  <!-- 왼쪽 상단 회사명 표시 -->
  <div class="company-logo">나나컴퍼니</div>

  <div class="container">
    <h1>📄 PDF 병합기</h1>

    <!-- 드래그 앤 드롭 지원 영역 -->
    <div class="upload-box" id="drop-zone" onclick="document.getElementById('pdf-input').click()">
      <p>PDF 파일을 여기에 드래그하거나<br>클릭하여 선택하세요</p>
      <input type="file" id="pdf-input" accept=".pdf" multiple>
    </div>

    <div class="file-list" id="file-list"></div>

    <button class="btn" id="merge-btn" disabled>PDF 합치기 및 다운로드</button>

    <div class="status" id="status-text"></div>
  </div>

  <script>
    const pdfInput = document.getElementById('pdf-input');
    const dropZone = document.getElementById('drop-zone');
    const fileListDiv = document.getElementById('file-list');
    const mergeBtn = document.getElementById('merge-btn');
    const statusText = document.getElementById('status-text');

    let selectedFiles = [];

    // UI 및 파일 목록 업데이트 함수
    function updateFileList() {
      if (selectedFiles.length > 0) {
        fileListDiv.innerHTML = selectedFiles.map((f, i) => 
          `<div class="file-item">${i + 1}. ${f.name}</div>`
        ).join('');
        mergeBtn.disabled = false;
        statusText.innerText = `총 ${selectedFiles.length}개의 파일이 선택되었습니다.`;
      } else {
        fileListDiv.innerHTML = '';
        mergeBtn.disabled = true;
        statusText.innerText = '';
      }
    }

    // 1. 일반 클릭 선택 이벤트
    pdfInput.addEventListener('change', (e) => {
      selectedFiles = Array.from(e.target.files);
      updateFileList();
    });

    // 2. 드래그 앤 드롭 이벤트
    ['dragenter', 'dragover'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropZone.classList.add('drag-over');
      }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropZone.classList.remove('drag-over');
      }, false);
    });

    dropZone.addEventListener('drop', (e) => {
      const droppedFiles = Array.from(e.dataTransfer.files).filter(file => file.type === 'application/pdf' || file.name.endsWith('.pdf'));

      if (droppedFiles.length === 0) {
        alert('PDF 파일만 끌어다 놓아주세요.');
        return;
      }

      selectedFiles = droppedFiles;
      updateFileList();
    });

    // 3. PDF 병합 기능
    mergeBtn.addEventListener('click', async () => {
      if (selectedFiles.length === 0) return;

      try {
        mergeBtn.disabled = true;
        statusText.innerText = 'PDF를 병합하는 중입니다...';

        const mergedPdf = await PDFLib.PDFDocument.create();

        for (const file of selectedFiles) {
          const arrayBuffer = await file.arrayBuffer();
          const pdf = await PDFLib.PDFDocument.load(arrayBuffer);
          const copiedPages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
          copiedPages.forEach((page) => mergedPdf.addPage(page));
        }

        const mergedPdfBytes = await mergedPdf.save();
        const blob = new Blob([mergedPdfBytes], { type: 'application/pdf' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'merged_document.pdf';
        link.click();

        statusText.innerText = '✅ 병합 완료! 파일이 다운로드되었습니다.';
      } catch (error) {
        console.error(error);
        statusText.innerText = '❌ 오류가 발생했습니다. PDF 파일을 확인해 주세요.';
      } finally {
        mergeBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
