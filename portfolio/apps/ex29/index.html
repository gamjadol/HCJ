<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keep Fit! BMI 계산기</title>
    <style>
        :root {
            --primary-color: #4A90E2;
            --bg-color: #F4F7F6;
            --card-bg: #FFFFFF;
            --text-color: #333333;
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 480px;
            padding: 28px;
            border-radius: var(--border-radius);
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: var(--primary-color);
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 0.95rem;
        }

        .gender-group {
            display: flex;
            gap: 12px;
        }

        .gender-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid #E0E0E0;
            border-radius: 8px;
            background: #FFF;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .gender-btn.active {
            border-color: var(--primary-color);
            background-color: #EBF3FA;
            color: var(--primary-color);
        }

        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #E0E0E0;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus {
            border-color: var(--primary-color);
        }

        .calc-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .calc-btn:hover {
            background-color: #357ABD;
        }

        .result-section {
            margin-top: 24px;
            display: none;
            border-top: 2px solid #F0F0F0;
            padding-top: 20px;
        }

        .bmi-badge {
            text-align: center;
            padding: 16px;
            background-color: #F8F9FA;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .bmi-score {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary-color);
        }

        .bmi-status {
            font-size: 1rem;
            font-weight: 600;
            margin-top: 4px;
        }

        .target-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .target-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #F9FAFB;
            border-radius: 8px;
            border-left: 4px solid var(--primary-color);
        }

        .target-title {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .target-sub {
            font-size: 0.8rem;
            color: #666;
        }

        .target-val {
            font-weight: 700;
            text-align: right;
        }

        .diff-lose { color: #E53935; } /* 감량 */
        .diff-gain { color: #1E88E5; } /* 증량 */
        .diff-zero { color: #43A047; } /* 유휴 */
    </style>
</head>
<body>

<div class="container">
    <h1>⚖️ Keep Fit! BMI 계산기</h1>
    
    <div class="form-group">
        <label>성별</label>
        <div class="gender-group">
            <button type="button" class="gender-btn active" onclick="selectGender('male')">남성</button>
            <button type="button" class="gender-btn" onclick="selectGender('female')">여성</button>
        </div>
    </div>

    <div class="form-group">
        <label for="height">신장 (cm)</label>
        <input type="number" id="height" placeholder="예: 175" min="100" max="250">
    </div>

    <div class="form-group">
        <label for="weight">몸무게 (kg)</label>
        <input type="number" id="weight" placeholder="예: 70" min="30" max="200">
    </div>

    <button class="calc-btn" onclick="calculateBMI()">BMI 및 목표 체중 계산하기</button>

    <div class="result-section" id="resultSection">
        <div class="bmi-badge">
            <div>현재 BMI</div>
            <div class="bmi-score" id="bmiScore">0.0</div>
            <div class="bmi-status" id="bmiStatus">-</div>
        </div>

        <h3 style="font-size: 1rem; margin-bottom: 12px;">📊 기준별 목표 체중 변화량</h3>
        <div class="target-list">
            <div class="target-item">
                <div>
                    <div class="target-title">BMI 90% 기준</div>
                    <div class="target-sub" id="targetBmi90">슬림 체중</div>
                </div>
                <div class="target-val" id="targetRes90">-</div>
            </div>

            <div class="target-item">
                <div>
                    <div class="target-title">BMI 100% 기준</div>
                    <div class="target-sub" id="targetBmi100">표준 체중</div>
                </div>
                <div class="target-val" id="targetRes100">-</div>
            </div>

            <div class="target-item">
                <div>
                    <div class="target-title">BMI 110% 기준</div>
                    <div class="target-sub" id="targetBmi110">건강/근육형 체중</div>
                </div>
                <div class="target-val" id="targetRes110">-</div>
            </div>
        </div>
    </div>
</div>

<script>
    let selectedGender = 'male';

    function selectGender(gender) {
        selectedGender = gender;
        const btns = document.querySelectorAll('.gender-btn');
        btns.forEach(btn => btn.classList.remove('active'));
        if (gender === 'male') {
            btns[0].classList.add('active');
        } else {
            btns[1].classList.add('active');
        }
    }

    function calculateBMI() {
        const heightInput = parseFloat(document.getElementById('height').value);
        const weightInput = parseFloat(document.getElementById('weight').value);

        if (!heightInput || !weightInput || heightInput <= 0 || weightInput <= 0) {
            alert('키와 몸무게를 올바르게 입력해 주세요.');
            return;
        }

        const heightM = heightInput / 100;
        const currentBMI = weightInput / (heightM * heightM);

        // 표준 BMI 설정 (성별 기준: 남성 22, 여성 21)
        const standardBMI = (selectedGender === 'male') ? 22.0 : 21.0;

        // BMI 90%, 100%, 110% 계산
        const bmi90 = standardBMI * 0.9;
        const bmi100 = standardBMI * 1.0;
        const bmi110 = standardBMI * 1.1;

        // 각 목표 체중 (kg)
        const targetWeight90 = bmi90 * (heightM * heightM);
        const targetWeight100 = bmi100 * (heightM * heightM);
        const targetWeight110 = bmi110 * (heightM * heightM);

        // 현재 BMI 표시
        document.getElementById('bmiScore').innerText = currentBMI.toFixed(1);
        
        let statusText = '';
        if (currentBMI < 18.5) statusText = '저체중';
        else if (currentBMI < 23.0) statusText = '정상 체중';
        else if (currentBMI < 25.0) statusText = '과체중';
        else statusText = '비만';
        
        document.getElementById('bmiStatus').innerText = statusText;

        // 서브 텍스트에 목표 BMI 명시
        document.getElementById('targetBmi90').innerText = `목표 BMI: ${bmi90.toFixed(1)} (${targetWeight90.toFixed(1)} kg)`;
        document.getElementById('targetBmi100').innerText = `목표 BMI: ${bmi100.toFixed(1)} (${targetWeight100.toFixed(1)} kg)`;
        document.getElementById('targetBmi110').innerText = `목표 BMI: ${bmi110.toFixed(1)} (${targetWeight110.toFixed(1)} kg)`;

        // 증감량 계산 및 렌더링
        renderTargetResult('targetRes90', weightInput, targetWeight90);
        renderTargetResult('targetRes100', weightInput, targetWeight100);
        renderTargetResult('targetRes110', weightInput, targetWeight110);

        document.getElementById('resultSection').style.display = 'block';
    }

    function renderTargetResult(elementId, currentW, targetW) {
        const diff = targetW - currentW;
        const elem = document.getElementById(elementId);

        if (Math.abs(diff) < 0.1) {
            elem.innerHTML = `<span class="diff-zero">현재 체중 유지</span>`;
        } else if (diff < 0) {
            elem.innerHTML = `<span class="diff-lose">${Math.abs(diff).toFixed(1)} kg 감량 필요</span>`;
        } else {
            elem.innerHTML = `<span class="diff-gain">${diff.toFixed(1)} kg 증량 필요</span>`;
        }
    }
</script>

</body>
</html>
